version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: b100_intelligence
      POSTGRES_USER: b100_user
      POSTGRES_PASSWORD: b100_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: bash -c "python webapp/manage.py migrate && python webapp/manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=b100_intelligence
      - DB_USER=b100_user
      - DB_PASSWORD=b100_password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - PYTHONPATH=/app
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A orchestration.celery_app worker -l info
    volumes:
      - .:/app
    environment:
      - DB_NAME=b100_intelligence
      - DB_USER=b100_user
      - DB_PASSWORD=b100_password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - PYTHONPATH=/app
    depends_on:
      - db
      - redis
      
  celery-beat:
    build: .
    command: celery -A orchestration.celery_app beat -l info
    volumes:
      - .:/app
    environment:
      - DB_NAME=b100_intelligence
      - DB_USER=b100_user
      - DB_PASSWORD=b100_password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - PYTHONPATH=/app
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
